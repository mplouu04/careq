<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Patient Registration - CAREQ</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "on-secondary-fixed": "#0b1c30",
                    "primary-fixed": "#dbe1ff",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-surface": "#191b23",
                    "inverse-on-surface": "#f0f0fb",
                    "tertiary-container": "#bc4800",
                    "tertiary-fixed-dim": "#ffb596",
                    "surface-container-low": "#f3f3fe",
                    "inverse-primary": "#b4c5ff",
                    "surface-tint": "#0053db",
                    "surface-dim": "#d9d9e5",
                    "surface-container-high": "#e7e7f3",
                    "secondary": "#505f76",
                    "on-secondary-fixed-variant": "#38485d",
                    "inverse-surface": "#2e3039",
                    "on-tertiary": "#ffffff",
                    "surface-container": "#ededf9",
                    "on-secondary-container": "#54647a",
                    "outline": "#737686",
                    "primary-container": "#2563eb",
                    "primary": "#004ac6",
                    "surface-bright": "#faf8ff",
                    "on-primary-fixed-variant": "#003ea8",
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-tertiary-fixed": "#360f00",
                    "tertiary": "#943700",
                    "surface-variant": "#e1e2ed",
                    "on-tertiary-container": "#ffede6",
                    "secondary-container": "#d0e1fb",
                    "secondary-fixed": "#d3e4fe",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#eeefff",
                    "on-background": "#191b23",
                    "on-surface-variant": "#434655",
                    "primary-fixed-dim": "#b4c5ff",
                    "outline-variant": "#c3c6d7",
                    "tertiary-fixed": "#ffdbcd",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#faf8ff",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "background": "#faf8ff",
                    "surface-container-highest": "#e1e2ed",
                    "on-primary-fixed": "#00174b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xxl": "48px",
                    "lg": "24px",
                    "margin-desktop": "40px",
                    "xs": "4px",
                    "sm": "8px",
                    "margin-mobile": "16px",
                    "xl": "32px",
                    "gutter": "24px",
                    "md": "16px"
            },
            "fontFamily": {
                    "headline-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "headline-sm": ["20px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-gradient-header {
            background: linear-gradient(135deg, #0053db 0%, #2563eb 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 bg-surface/95 backdrop-blur-sm border-b border-outline-variant dark:border-outline shadow-sm">
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">CAREQ</div>
<nav class="hidden md:flex gap-xl">
<a class="text-primary font-bold border-b-2 border-primary pb-1 font-body-md text-body-md hover:text-primary transition-colors" href="#">Check In</a>
<a class="text-on-surface-variant dark:text-surface-variant font-body-md text-body-md hover:text-primary transition-colors" href="#">Queue Status</a>
</nav>
<button class="text-primary font-body-md text-body-md hover:opacity-80 transition-opacity">Staff Login</button>
</header>
<main class="flex-grow flex items-center justify-center py-xxl px-margin-mobile">
<!-- Registration Form Card -->
<div class="w-full max-max-w-2xl bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant overflow-hidden md:max-w-3xl">
<!-- Form Header -->
<div class="form-gradient-header px-lg py-xl text-white">
<h1 class="font-headline-md text-headline-md mb-xs">Patient Registration</h1>
<p class="font-body-sm text-body-sm opacity-90">Please provide your details for efficient medical queue management.</p>
</div>
<!-- Form Content -->
<form class="p-lg space-y-lg" id="registrationForm">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- First Name -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="firstName">First name</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all font-body-md text-body-md" id="firstName" name="firstName" required="" type="text"/>
</div>
<!-- Last Name -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="lastName">Last name</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all font-body-md text-body-md" id="lastName" name="lastName" required="" type="text"/>
</div>
<!-- DOB -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="dob">Date of birth</label>
<div class="relative">
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all font-body-md text-body-md appearance-none" id="dob" name="dob" required="" type="date"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Gender -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="gender">Gender</label>
<select class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all font-body-md text-body-md" id="gender" name="gender" required="">
<option value="">Select gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
<option value="prefer_not_to_say">Prefer not to say</option>
</select>
</div>
<!-- Phone -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="phone">Phone (11 digits)</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all font-body-md text-body-md" id="phone" name="phone" pattern="[0-9]{11}" placeholder="07123456789" required="" type="tel"/>
</div>
<!-- Email -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<input class="w-full h-11 px-md bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all font-body-md text-body-md" id="email" name="email" placeholder="example@email.com" required="" type="email"/>
</div>
</div>
<!-- Address -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="address">Address</label>
<textarea class="w-full p-md bg-surface-container-low border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all font-body-md text-body-md resize-none" id="address" name="address" required="" rows="3"></textarea>
</div>
<!-- Consent Checkbox -->
<div class="flex items-start gap-md py-sm">
<div class="flex items-center h-11">
<input class="w-6 h-6 text-primary bg-surface-container-low border-outline-variant rounded focus:ring-primary transition-colors cursor-pointer" id="consent" name="consent" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none py-xs" for="consent">
                        I consent to the collection and processing of my personal data for the purpose of clinic management and health services. I understand that my data is protected under healthcare privacy laws.
                    </label>
</div>
<!-- Register Button -->
<div class="pt-md">
<button class="w-full h-[44px] bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-surface-tint active:scale-95 transition-all flex items-center justify-center gap-sm" type="submit">
<span>Register</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-lg px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-md bg-surface-container-lowest border-t border-outline-variant dark:border-outline">
<div class="font-label-md text-label-md font-black text-on-surface">CAREQ</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">© 2024 CAREQ Queue Management System</div>
<div class="flex gap-lg">
<a class="text-on-surface-variant font-body-sm text-body-sm hover:text-primary transition-colors" href="#">Live Updates</a>
<a class="text-on-surface-variant font-body-sm text-body-sm hover:text-primary transition-colors" href="#">Contact Clinic</a>
</div>
</footer>
<script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Basic animation for feedback
            btn.innerHTML = `
                <span class="animate-spin material-symbols-outlined text-[20px]" data-icon="progress_activity">progress_activity</span>
                <span>Processing...</span>
            `;
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span>
                    <span>Registration Complete</span>
                `;
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-green-600');
                
                // Show a success state/redirect simulation
                setTimeout(() => {
                    alert('Registration successful! You are now in the queue.');
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.add('bg-primary');
                    btn.classList.remove('bg-green-600');
                    e.target.reset();
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
