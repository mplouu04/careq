        body { font-family: 'Inter', sans-serif; }

        }
        .floating-shape {

            z-index: -1;

        }

<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden">
<!-- Background Atmospheric Effects -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="floating-shape bg-primary w-[500px] h-[500px] -top-48 -left-24"></div>
<div class="floating-shape bg-secondary-container w-[400px] h-[400px] bottom-0 -right-24"></div>
<div class="floating-shape bg-primary-fixed w-[300px] h-[300px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
</div>
<!-- Navigation Shell (Suppressed as per "Destination" Rule for Transactional Page, but keeping TopBar Identity as per B1 requirement) -->
<header class="sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 bg-surface/95 backdrop-blur-sm border-b border-outline-variant">
<div class="flex items-center gap-sm">
<span class="font-headline-md text-headline-md font-bold text-primary">CAREQ</span>
</div>
<div>
<a class="font-body-md text-body-md text-primary font-bold transition-opacity hover:opacity-80" href="#">
                Help Center
            </a>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-md">
<!-- Login Container -->
<div class="w-full max-w-[440px] flex flex-col gap-xl">
<!-- Branding/Heading -->
<div class="text-center space-y-sm">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Staff Portal</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your clinic management dashboard</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-sm relative overflow-hidden">
<!-- Subtle Top Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Staff Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-[44px] pl-12 pr-md bg-surface-bright border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all font-body-md text-body-md" id="email" name="email" placeholder="name@clinic.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-[44px] pl-12 pr-md bg-surface-bright border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:ring-offset-2 outline-none transition-all font-body-md text-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Options -->
<div class="flex items-center gap-sm h-11">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Keep me logged in for 24 hours</label>
</div>
<!-- CTA -->
<button class="w-full h-[48px] bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-sm" type="submit">
                        Sign In
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<div class="mt-xl pt-lg border-t border-outline-variant flex items-center justify-center">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">verified_user</span>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Secure Clinic Access</p>
</div>
</div>
</div>

<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent flex flex-col justify-end p-xl">
<h2 class="font-headline-md text-headline-md text-white mb-xs">Optimize Your Workflow</h2>
<p class="font-body-md text-body-md text-white/90">Join 500+ clinics reducing wait times by 40% globally.</p>
</div>
</div>
<script>
        // Micro-interaction for input focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#004ac6';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#737686';
            });
        });

        // Atmospheric parallax on mouse move
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            
            document.querySelectorAll('.floating-shape').forEach((shape, index) => {
                const multiplier = (index + 1) * 2;
                shape.style.transform = `translate(${moveX * multiplier}px, ${moveY * multiplier}px)`;
            });
        });
    </script>
