<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CAREQ | Patient Check-In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf8ff;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "tertiary": "#943700",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-container": "#ffede6",
                        "surface-bright": "#faf8ff",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-secondary-fixed": "#0b1c30",
                        "secondary-fixed": "#d3e4fe",
                        "primary": "#004ac6",
                        "on-surface": "#191b23",
                        "on-primary-container": "#eeefff",
                        "surface": "#faf8ff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e1e2ed",
                        "surface-tint": "#0053db",
                        "surface-container-low": "#f3f3fe",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d9d9e5",
                        "inverse-primary": "#b4c5ff",
                        "on-surface-variant": "#434655",
                        "error": "#ba1a1a",
                        "secondary-container": "#d0e1fb",
                        "primary-container": "#2563eb",
                        "on-background": "#191b23",
                        "background": "#faf8ff",
                        "surface-container": "#ededf9",
                        "secondary": "#505f76",
                        "on-secondary-container": "#54647a",
                        "on-primary-fixed": "#00174b",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdbcd",
                        "tertiary-fixed-dim": "#ffb596",
                        "tertiary-container": "#bc4800",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f0f0fb",
                        "outline": "#737686",
                        "on-tertiary-fixed": "#360f00",
                        "surface-container-high": "#e7e7f3",
                        "inverse-surface": "#2e3039",
                        "outline-variant": "#c3c6d7",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-container-highest": "#e1e2ed",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "12px",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xxl": "48px",
                        "md": "16px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "xs": "4px",
                        "gutter": "24px",
                        "xl": "32px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "headline-sm": ["20px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopNavBar -->
<nav class="sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 bg-surface/95 backdrop-blur-sm shadow-sm border-b border-outline-variant">
<div class="flex items-center gap-xl">
<span class="font-headline-md text-headline-md font-bold text-primary">CAREQ</span>
<div class="hidden md:flex gap-lg items-center h-full">
<a class="text-primary font-bold border-b-2 border-primary pb-1 transition-colors font-body-md text-body-md" href="#">Check In</a>
<a class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md" href="#">Queue Status</a>
</div>
</div>
<div class="flex items-center gap-md">
<button class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-body-md">Staff Login</button>
</div>
</nav>
<main class="flex-grow flex items-center justify-center px-margin-mobile py-xl bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-primary/5 via-transparent to-transparent">
<!-- Check-in Card Container -->
<div class="w-full max-w-xl animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- White Card -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm overflow-hidden">
<!-- Patient Info Banner -->
<div class="bg-primary/5 px-lg py-md flex items-center gap-md border-b border-outline-variant">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="person">person</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Checking in:</p>
<h2 class="font-headline-sm text-headline-sm text-on-surface">James Wilson</h2>
</div>
</div>
<!-- Tabs -->
<div class="flex border-b border-outline-variant">
<button class="flex-1 py-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container transition-all text-center">
                        BY APPOINTMENT
                    </button>
<button class="flex-1 py-lg font-label-md text-label-md text-primary border-b-2 border-primary bg-primary/5 transition-all text-center">
                        WALK-IN
                    </button>
</div>
<!-- Form Content (Walk-in Tab) -->
<div class="p-lg space-y-lg">
<!-- Visit Type -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="visit-type">Visit Type</label>
<div class="relative">
<select class="w-full h-11 px-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:ring-offset-2 appearance-none font-body-md text-body-md transition-all" id="visit-type">
<option disabled="" selected="" value="">Select visit type</option>
<option value="general">General Consultation</option>
<option value="urgent">Urgent Care / Acute Illness</option>
<option value="follow-up">Follow-up Visit</option>
<option value="results">Review Test Results</option>
<option value="vaccination">Vaccination</option>
</select>
<div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Reason for Visit -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="reason">Reason for Visit</label>
<textarea class="w-full p-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:ring-offset-2 font-body-md text-body-md transition-all resize-none" id="reason" placeholder="Briefly describe why you are visiting today..." rows="4"></textarea>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-md group cursor-pointer">
<div class="flex items-center h-6">
<input class="w-5 h-5 text-primary border-outline-variant rounded focus:ring-primary focus:ring-offset-2 transition-all cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="terms">
                            I agree to clinic terms, including data privacy policies and the estimated wait time acknowledgement.
                        </label>
</div>
<!-- Action Button -->
<button class="w-full h-11 bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded-lg shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
                        Complete Check-In
                        <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- Footer-style helper text -->
<p class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant">
                Need assistance? Visit the front desk or <a class="text-primary hover:underline" href="#">Contact Clinic</a>.
            </p>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-lg px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-md bg-surface-container-lowest border-t border-outline-variant">
<span class="font-label-md text-label-md font-black text-on-surface">CAREQ</span>
<div class="flex gap-lg">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Live Updates</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Contact Clinic</a>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">© 2024 CAREQ Queue Management System</p>
</footer>
<!-- Interactive Layer: Simple ripple-like effect on button -->
<script>
        document.querySelector('button.bg-primary').addEventListener('click', function(e) {
            if (!document.getElementById('terms').checked) {
                alert('Please agree to the clinic terms to proceed.');
                return;
            }
            // Add a temporary "processing" state
            const originalContent = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Processing...';
            this.disabled = true;
            this.classList.add('opacity-80');
            
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Success!';
                this.classList.remove('bg-primary');
                this.classList.add('bg-green-600');
                
                setTimeout(() => {
                   window.location.reload();
                }, 1500);
            }, 2000);
        });

        // Tab switching logic (Visual only for this task)
        const tabs = document.querySelectorAll('.flex.border-b button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('text-primary', 'border-b-2', 'border-primary', 'bg-primary/5');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.remove('text-on-surface-variant');
                tab.classList.add('text-primary', 'border-b-2', 'border-primary', 'bg-primary/5');
            });
        });
    </script>
</body></html>
