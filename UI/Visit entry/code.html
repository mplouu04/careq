<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CAREQ | Visit Entry</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "on-secondary-fixed": "#0b1c30",
                    "primary-fixed": "#dbe1ff",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-surface": "#191b23",
                    "inverse-on-surface": "#f0f0fb",
                    "tertiary-container": "#bc4800",
                    "tertiary-fixed-dim": "#ffb596",
                    "surface-container-low": "#f3f3fe",
                    "inverse-primary": "#b4c5ff",
                    "surface-tint": "#0053db",
                    "surface-dim": "#d9d9e5",
                    "surface-container-high": "#e7e7f3",
                    "secondary": "#505f76",
                    "on-secondary-fixed-variant": "#38485d",
                    "inverse-surface": "#2e3039",
                    "on-tertiary": "#ffffff",
                    "surface-container": "#ededf9",
                    "on-secondary-container": "#54647a",
                    "outline": "#737686",
                    "primary-container": "#2563eb",
                    "primary": "#004ac6",
                    "surface-bright": "#faf8ff",
                    "on-primary-fixed-variant": "#003ea8",
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-tertiary-fixed": "#360f00",
                    "tertiary": "#943700",
                    "surface-variant": "#e1e2ed",
                    "on-tertiary-container": "#ffede6",
                    "secondary-container": "#d0e1fb",
                    "secondary-fixed": "#d3e4fe",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#eeefff",
                    "on-background": "#191b23",
                    "on-surface-variant": "#434655",
                    "primary-fixed-dim": "#b4c5ff",
                    "outline-variant": "#c3c6d7",
                    "tertiary-fixed": "#ffdbcd",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#faf8ff",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "background": "#faf8ff",
                    "surface-container-highest": "#e1e2ed",
                    "on-primary-fixed": "#00174b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xxl": "48px",
                    "lg": "24px",
                    "margin-desktop": "40px",

            "fontFamily": {

                    "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}]

          },
        },

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopNavBar (Shared Component) -->
<!-- The "Check In" link is active based on page intent -->
<nav class="sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 bg-surface/95 backdrop-blur-sm shadow-sm border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-xl">
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">CAREQ</span>
<div class="hidden md:flex items-center gap-lg">
<a class="font-body-md text-body-md text-primary font-bold border-b-2 border-primary pb-1 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors" href="#">Check In</a>
<a class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors" href="#">Queue Status</a>
</div>
</div>
<div class="flex items-center">
<button class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant hover:text-primary dark:hover:text-primary-fixed-dim transition-colors">Staff Login</button>
</div>
</nav>
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile">
<div class="max-w-xl w-full">
<!-- Entry Card -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-xl md:p-xxl flex flex-col items-center text-center">
<!-- Visual Anchor -->
<div class="mb-lg w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined !text-[40px]" style="font-variation-settings: 'FILL' 0;">local_hospital</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-md">Welcome to CAREQ</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-sm">
                    Have you been here before, or is this your first visit?
                </p>
<!-- Action Group -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md w-full">
<!-- Yes Button -->
<button class="group relative flex flex-col items-center p-lg border border-outline-variant rounded-xl hover:border-primary hover:bg-surface-container-low transition-all duration-300" onclick="handleSelection('returning')">
<div class="mb-md w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Yes, I've been here before</span>
</button>
<!-- No Button -->
<button class="group relative flex flex-col items-center p-lg border border-outline-variant rounded-xl hover:border-primary hover:bg-surface-container-low transition-all duration-300" onclick="handleSelection('new')">
<div class="mb-md w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person_add</span>
</div>
<span class="font-label-md text-label-md text-on-surface">No, this is my first visit</span>
</button>
</div>
<div class="mt-xl">
<button class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined !text-[16px]">language</span>
                        Change Language
                    </button>
</div>
</section>
<!-- Decorative Elements (Subtle Atmospheric Touches) -->
<div class="mt-xl flex justify-center gap-xxl opacity-30 grayscale pointer-events-none select-none">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined">security</span>
<span class="font-label-sm text-label-sm">Secure Entry</span>
</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined">privacy_tip</span>
<span class="font-label-sm text-label-sm">Privacy Guaranteed</span>
</div>
</div>
</div>
</main>
<!-- Footer (Shared Component) -->
<footer class="w-full py-lg px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-md bg-surface-container-lowest border-t border-outline-variant dark:border-outline">
<div class="flex items-center gap-md">
<span class="font-label-md text-label-md font-black text-on-surface">CAREQ</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">© 2024 CAREQ Queue Management System</span>
</div>
<div class="flex gap-lg">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Live Updates</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Contact Clinic</a>
</div>
</footer>
<script>
        function handleSelection(type) {
            console.log("User selected: " + type);
            const card = document.querySelector('section');
            card.style.opacity = '0.5';
            card.style.transform = 'scale(0.98)';
            card.style.transition = 'all 0.3s ease';
            
            // Simulation of transition to next step
            setTimeout(() => {
                alert(type === 'returning' ? 'Redirecting to returning patient check-in...' : 'Redirecting to new patient registration...');
                card.style.opacity = '1';
                card.style.transform = 'scale(1)';
            }, 300);
        }
    </script>
</body></html>
